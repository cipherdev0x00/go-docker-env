services:
  go:
    build: .
    container_name: go-dev
    working_dir: /workspace
    volumes:
      # Your projects live on the host in ./projects
      - ./projects:/workspace
      # Persistent caches so dependencies are not re-downloaded
      - go-mod:/home/dev/go/pkg/mod
      - go-build:/home/dev/.cache/go-build
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://dev:dev@db:5432/app?sslmode=disable
    # Keep the container alive so you can exec into it
    command: sleep infinity

  # Optional Postgres. Start it with: docker compose --profile db up -d
  db:
    image: postgres:17
    profiles: ["db"]
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  go-mod:
  go-build:
  pg-data: